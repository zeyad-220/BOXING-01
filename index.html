<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>بوكسينج من الصفر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: dark gym-deck hero and sticky nav over a cool canvas-grey field. Content sits in one centered wrap; sections are display-type headings over card grids. Blue = lead hand, red = rear hand, everywhere. */
:root{
  --bg:#EDF0F3; --fg:#12161C; --muted:#566170; --card:#FFFFFF; --line:#D2D9E1;
  --blue:#1E4DB7; --red:#C42B2B; --on-blue:#FFFFFF; --on-red:#FFFFFF;
  --blue-soft:#E3EBFA; --red-soft:#FBE6E4;
  --deck:#11151B; --deck-fg:#F2F4F7; --deck-muted:#9AA6B6; --deck-blue:#7FA6FF; --deck-red:#FF7A6E; --deck-line:#2A323D;
  --display:'Bebas Neue','Cairo',Impact,sans-serif;
  --body:'Inter','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --fg:#E8ECF1; --muted:#98A3B2; --card:#171D25; --line:#29313C;
    --blue:#7FA6FF; --red:#FF7A6E; --on-blue:#0E1217; --on-red:#0E1217;
    --blue-soft:#1A2640; --red-soft:#3A1E1F; --deck:#080B0F; --deck-line:#222a34; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --fg:#E8ECF1; --muted:#98A3B2; --card:#171D25; --line:#29313C;
  --blue:#7FA6FF; --red:#FF7A6E; --on-blue:#0E1217; --on-red:#0E1217;
  --blue-soft:#1A2640; --red-soft:#3A1E1F; --deck:#080B0F; --deck-line:#222a34; color-scheme:dark;
}
html[lang="ar"]{--display:'Cairo',system-ui,sans-serif;--body:'Cairo','Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deck)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding-inline-start:1.25rem}
li+li{margin-top:.3rem}

/* hero */
.hero{background:var(--deck);color:var(--deck-fg);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 2.5rem);padding-bottom:2.5rem}
.hero h1{font:400 clamp(3.4rem,11vw,7.5rem)/.95 var(--display);letter-spacing:.02em;text-wrap:balance}
html[lang="ar"] .hero h1{font-weight:900;letter-spacing:0;line-height:1.15}
.hero p.sub{max-width:62ch;color:var(--deck-muted);font-size:1.1rem;margin-top:1rem}
.punchrow{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.pk{display:flex;align-items:center;gap:.5rem;border:1px solid var(--deck-line);border-radius:8px;padding:.35rem .75rem .35rem .4rem;font-size:.9rem}
html[dir="rtl"] .pk{padding:.35rem .4rem .35rem .75rem}
.legend{margin-top:1rem;color:var(--deck-muted);font-size:.9rem;display:flex;gap:1rem;flex-wrap:wrap}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-inline-end:.4rem;vertical-align:-1px}
.herobtns{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}

/* chips for punch numbers */
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;padding:0 .5rem;border-radius:6px;font:400 1.35rem/1 var(--display);background:var(--line);color:var(--fg);flex:none;gap:0}
html[lang="ar"] .chip{font-weight:800;font-size:1.05rem}
.chip.l{background:var(--blue);color:var(--on-blue)}
.chip.r{background:var(--red);color:var(--on-red)}
.chip small{font:600 .55rem/1 var(--body);margin-top:-1px;letter-spacing:0}
.chip.n{padding:0 .7rem;font:600 .8rem/1 var(--body);white-space:nowrap}
.deck .chip.l,.hero .chip.l,.roul .chip.l{background:var(--deck-blue);color:#0b0f14}
.deck .chip.r,.hero .chip.r,.roul .chip.r{background:var(--deck-red);color:#0b0f14}
.deck .chip.n,.hero .chip.n,.roul .chip.n{background:#2a323d;color:var(--deck-fg)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--deck);color:var(--deck-fg);border-bottom:1px solid var(--deck-line)}
.navin{display:flex;align-items:center;gap:.6rem;padding-block:.55rem}
.navin .chips{display:flex;gap:.35rem;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin;padding-block:2px}
.navin .chips a{white-space:nowrap;text-decoration:none;font-size:.88rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--deck-line);color:var(--deck-fg)}
.navin .chips a:hover{background:#242c37}
.langbtn{flex:none;font:600 .85rem var(--body);background:var(--deck-fg);color:var(--deck);border:0;border-radius:6px;padding:.4rem .8rem;cursor:pointer}

/* sections */
section{padding-block:3.2rem;border-top:1px solid var(--line);scroll-margin-top:calc(3.6rem + env(safe-area-inset-top,0px))}
section:first-child{border-top:0}
.sh{margin-bottom:1.6rem}
.sh h2{font:400 clamp(2.4rem,6vw,3.6rem)/1 var(--display);letter-spacing:.02em;text-wrap:balance}
html[lang="ar"] .sh h2{font-weight:900;letter-spacing:0;line-height:1.25}
.sh p{color:var(--muted);max-width:65ch;margin-top:.6rem}
.sub2{font:700 1.15rem var(--body);margin:2rem 0 .9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.1rem 1rem;min-width:0;display:flex;flex-direction:column;gap:.7rem}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.ch h3{font:700 1.1rem/1.35 var(--body);flex:1;min-width:0}
.tag{font-size:.72rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem;color:var(--muted);white-space:nowrap}
.dose{align-self:flex-start;font-weight:700;font-size:.85rem;background:var(--red-soft);color:var(--red);border-radius:6px;padding:.1rem .6rem}
.card .d{color:var(--muted);font-size:.95rem}
.card h4{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.2rem 0 .35rem}
html[lang="ar"] .card h4{letter-spacing:0;text-transform:none;font-size:.85rem}
.card ol,.card ul{font-size:.95rem}
.card .drill{font-size:.92rem;background:var(--blue-soft);border-radius:6px;padding:.55rem .7rem}
.vid{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:auto;padding-top:.3rem}
.vid a{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;font-size:.82rem;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:.3rem .65rem}
.vid a:hover{border-color:var(--red);color:var(--red)}
.vid svg{width:.7rem;height:.7rem;fill:var(--red)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.rules{columns:2 300px;column-gap:2rem}
.rules li{break-inside:avoid;margin-bottom:.5rem}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:.6rem;padding:0;list-style:none;counter-reset:p}
.path li{counter-increment:p;margin:0}
.path a{display:flex;gap:.7rem;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;font-weight:600}
.path a::before{content:counter(p);font:400 1.4rem/1 var(--display);color:var(--red);min-width:1.2rem}
.note{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:8px;padding:.9rem 1rem;color:var(--muted);font-size:.95rem}
svg.feet{width:100%;height:auto;max-width:420px;display:block;margin-inline:auto;direction:ltr}
svg.feet text{font:600 12px var(--body);fill:var(--fg);text-anchor:middle}

/* buttons / inputs */
.btn{font:600 .95rem var(--body);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.55rem 1rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--fg)}
.btn.p{background:var(--red);border-color:transparent;color:var(--on-red)}
.btn.b{background:var(--blue);border-color:transparent;color:var(--on-blue)}
.hero .btn{background:transparent;color:var(--deck-fg);border-color:var(--deck-line)}
.hero .btn.p{background:var(--deck-red);color:#0b0f14;border-color:transparent}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=number]{font:600 1rem var(--body);width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;font-weight:600;color:var(--muted)}

/* combos */
.combo{display:flex;flex-direction:column;gap:.6rem}
.seq{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.roul{background:var(--deck);color:var(--deck-fg);border-radius:10px;padding:1.4rem;margin-bottom:1.2rem}
.roul .seq{gap:.6rem;min-height:3.6rem;margin:.8rem 0}
.roul .chip{min-width:3.4rem;height:3.4rem;font-size:2.2rem}
html[lang="ar"] .roul .chip{font-size:1.6rem}
.roul .chip.n{font-size:.95rem}
.roul p{color:var(--deck-muted)}
.roul .btn{background:var(--deck-fg);color:var(--deck);border:0}
.roul h3{font:700 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--deck-muted)}
html[lang="ar"] .roul h3{letter-spacing:0;text-transform:none;font-size:.95rem}

/* timer */
.tbox{border-radius:12px;padding:1.6rem 1rem;text-align:center;background:var(--deck);color:var(--deck-fg);transition:background .25s}
.tbox.work{background:var(--red);color:var(--on-red)}
.tbox.rest{background:var(--blue);color:var(--on-blue)}
.tbox .ph{font:700 1rem var(--body);letter-spacing:.1em;text-transform:uppercase}
html[lang="ar"] .tbox .ph{letter-spacing:0;text-transform:none;font-size:1.2rem}
.tbox .tm{font:400 clamp(4.5rem,22vw,9rem)/1 'Bebas Neue',Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tbox .rd{font-weight:600;opacity:.9}
.tctl{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.tctl .btn{min-width:6.5rem;background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.35)}
.tcfg{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-top:1rem}
.presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}

/* checklist */
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
.chk label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;font-size:.95rem}
.chk input{width:1.15rem;height:1.15rem;margin-top:.25rem;accent-color:var(--red);flex:none}
.chk ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:.5rem}
.chk li{margin:0}
.lvh{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.lvh span{font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:start;vertical-align:top}
th{font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
footer{border-top:1px solid var(--line);padding-block:2rem 3rem;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i,.tbox{transition:none}}

/* ===== premium layer: depth, motion, new features ===== */
:root{
  --sh1:0 1px 2px rgba(18,22,28,.06),0 10px 28px -14px rgba(18,22,28,.22);
  --sh2:0 2px 4px rgba(18,22,28,.08),0 26px 48px -20px rgba(18,22,28,.38);
  --glowl:rgba(30,77,183,.45); --glowr:rgba(196,43,43,.42);
  --deck-a:rgba(17,21,27,.84);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sh1:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
    --sh2:0 2px 6px rgba(0,0,0,.5),0 28px 50px -20px rgba(0,0,0,.85);
    --glowl:rgba(127,166,255,.35); --glowr:rgba(255,122,110,.32); --deck-a:rgba(8,11,15,.84);
  }
}
:root[data-theme="dark"]{
  --sh1:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 28px 50px -20px rgba(0,0,0,.85);
  --glowl:rgba(127,166,255,.35); --glowr:rgba(255,122,110,.32); --deck-a:rgba(8,11,15,.84);
}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,70px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(80px,-50px) scale(1.1)}}
@keyframes shine{from{background-position:200% 0}to{background-position:-50% 0}}
@keyframes sheen{from{background-position:0 0}to{background-position:300% 0}}
@keyframes hit{0%,16%,100%{transform:none;box-shadow:none;border-color:var(--deck-line)}4%,9%{transform:translateY(-6px);border-color:var(--deck-fg);box-shadow:0 12px 26px -10px rgba(127,166,255,.6)}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.035)}}
@keyframes bump{40%{transform:scale(1.35)}}

/* hero */
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
.hero::before{width:440px;height:440px;background:var(--deck-red);top:-160px;inset-inline-end:-90px;animation:drift1 14s ease-in-out infinite alternate}
.hero::after{width:400px;height:400px;background:var(--deck-blue);bottom:-190px;inset-inline-start:-110px;animation:drift2 17s ease-in-out infinite alternate}
.hero .wrap{position:relative;z-index:1}
.hero .wrap>*{animation:up .8s var(--ease) both}
.hero .wrap>*:nth-child(2){animation-delay:.1s}.hero .wrap>*:nth-child(3){animation-delay:.2s}.hero .wrap>*:nth-child(4){animation-delay:.3s}.hero .wrap>*:nth-child(5){animation-delay:.4s}.hero .wrap>*:nth-child(6){animation-delay:.5s}.hero .wrap>*:nth-child(7){animation-delay:.6s}
.hero .wrap>h1{color:var(--deck-fg);animation:up .8s var(--ease) both,shine 9s linear infinite}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .hero .wrap>h1{background:linear-gradient(100deg,#fff 18%,#9fb8ff 42%,#ff9b91 58%,#fff 82%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
}
.pk{animation:hit 6.5s calc(var(--i) * .45s) infinite ease-in-out;background:rgba(255,255,255,.03)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1rem;margin-top:1.8rem;max-width:640px}
.stat{border-top:1px solid var(--deck-line);padding-top:.7rem}
.stat b{display:block;font:400 clamp(2.2rem,6vw,3.2rem)/1 var(--display);font-variant-numeric:tabular-nums}
html[lang="ar"] .stat b{font-weight:800}
.stat span{color:var(--deck-muted);font-size:.85rem}
.ropes{display:grid;gap:7px;margin-top:2.2rem}
.ropes i{display:block;height:3px;border-radius:3px;opacity:.55;background:linear-gradient(90deg,var(--deck-red),#fff,var(--deck-blue),#fff,var(--deck-red)) 0 0/300% 100%;animation:sheen 7s linear infinite}
.ropes i:nth-child(2){animation-delay:-2.3s}.ropes i:nth-child(3){animation-delay:-4.6s}
.hero .btn.p{box-shadow:0 12px 28px -10px var(--glowr)}

/* nav */
.nav{background:var(--deck-a);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.navin .chips a{transition:background .2s,color .2s,transform .2s}
.navin .chips a:hover{transform:translateY(-1px)}
.navin .chips a[aria-current="true"]{background:var(--deck-fg);color:var(--deck);border-color:var(--deck-fg)}
.iconbtn{flex:none;width:2.1rem;height:2.1rem;border-radius:6px;border:1px solid var(--deck-line);background:transparent;color:var(--deck-fg);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.iconbtn:hover{background:#242c37}
.sp{position:absolute;inset-inline:0;bottom:-1px;height:3px;pointer-events:none}
.sp i{display:block;height:100%;background:linear-gradient(90deg,var(--deck-blue),var(--deck-red));transform:scaleX(0);transform-origin:left}
html[dir="rtl"] .sp i{transform-origin:right}

/* search */
.searchwrap{padding-top:1.6rem}
.search{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.25rem 1rem;box-shadow:var(--sh1);color:var(--muted);transition:box-shadow .25s,border-color .25s}
.search:focus-within{border-color:var(--blue);box-shadow:var(--sh2)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:500 1rem var(--body);color:var(--fg);padding:.7rem 0;outline:0}
.search #qc{font-size:.85rem;font-weight:600;white-space:nowrap}

/* depth and motion for content */
section{padding-block:3.6rem}
.sh h2::after{content:"";display:block;height:4px;width:0;margin-top:.7rem;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--red));transition:width .9s var(--ease) .2s}
.sh.in h2::after{width:84px}
.card{position:relative;overflow:hidden;box-shadow:var(--sh1);border-radius:12px;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s}
.card>*{position:relative;z-index:1}
.card[data-n]::after{content:attr(data-n);position:absolute;z-index:0;inset-inline-end:.8rem;top:-.5rem;font:400 7rem/1 'Bebas Neue',Impact,sans-serif;opacity:.1;pointer-events:none}
.card[data-h="l"]::after{color:var(--blue)}.card[data-h="r"]::after{color:var(--red)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh2);border-color:var(--muted)}
.card[data-h="l"]:hover{box-shadow:var(--sh2),0 22px 44px -22px var(--glowl)}
.card[data-h="r"]:hover{box-shadow:var(--sh2),0 22px 44px -22px var(--glowr)}
.rv.in{animation:rise .8s var(--d,0ms) var(--ease) backwards}
.btn{transition:transform .18s var(--ease),box-shadow .25s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.btn:active{transform:scale(.96)}
.btn.p{box-shadow:0 10px 22px -10px var(--glowr)}
.vid a{transition:transform .2s,border-color .2s,color .2s}
.vid a:hover{transform:translateY(-1px)}
.path a{transition:transform .25s var(--ease),box-shadow .25s}
.path a:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.roul{box-shadow:var(--sh2);background:linear-gradient(135deg,var(--deck),#1b2230)}
.roul .chip,.tbox .seq .chip{animation:pop .5s calc(var(--i,0) * 80ms) cubic-bezier(.3,1.6,.5,1) backwards}
.tabs .btn[aria-pressed="true"]{box-shadow:var(--sh1)}
.addbtn{flex:none;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 1.15rem/1 var(--body);cursor:pointer;display:grid;place-items:center;transition:transform .25s var(--ease),background .2s,color .2s}

const KEYS = {};
function keyed(arr, p) { arr.forEach((x, i) => { x.k = p + i; KEYS[x.k] = x; }); }

/* ---------- renderers ---------- */
function addBtn(it) {
  return it.k ? '<button class="addbtn" type="button" data-act="add" data-k="' + it.k + '" aria-pressed="false" aria-label="' + T(["أضف إلى جلستي", "Add to my session"]) + '">+</button>' : "";
}
function exAttrs(it) {
  if (!it.k) return "";
  const sx = (it.n[0] + " " + it.n[1] + " " + (it.d ? it.d[0] + " " + it.d[1] : "")).toLowerCase().replace(/"/g, "");
  return ' data-ex data-s="' + sx + '"';
}
function vids(it, suf) {
  const q = it.q || [T0(it.n) + " " + suf[0], it.n[1] + " " + suf[1]];
  return '<div class="vid"><a href="' + yt(q[0]) + '" target="_blank" rel="noopener">' + PLAY + T(UI.vidAr) + '</a><a href="' + yt(q[1]) + '" target="_blank" rel="noopener">' + PLAY + T(UI.vidEn) + "</a></div>";
}
function T0(a) { return a[0]; }
function chip(tok) {
  const m = /^([1-6])(b?)$/.exec(tok);
  if (m) {
    const hand = (+m[1]) % 2 ? "l" : "r";
    return '<span class="chip ' + hand + '">' + m[1] + (m[2] ? "<small>" + (L ? "BODY" : "جسم") + "</small>" : "") + "</span>";
  }
  const m2 = /^([1-6])b$/.exec(tok);
  return '<span class="chip n">' + T(TOK[tok] || [tok, tok]) + "</span>";
}
function card(it, suf, o) {
  o = o || {};
  const num = it.num ? '<span class="chip ' + it.hand + '">' + it.num + "</span>" : (it.num === 0 ? '<span class="chip n">' + (L ? "BODY" : "جسم") + "</span>" : "");
  return '<article class="card' + (o.wide ? " wide" : "") + '"' + exAttrs(it) + (it.num ? ' data-n="' + it.num + '" data-h="' + it.hand + '"' : "") + '><header class="ch">' + num + "<h3>" + T(it.n) + "</h3>" + (it.lv ? '<span class="tag">' + T(LV[it.lv]) + "</span>" : "") + addBtn(it) + "</header>" +
    (it.dose ? '<span class="dose">' + T(it.dose) + "</span>" : "") +
    (it.d ? '<p class="d">' + T(it.d) + "</p>" : "") +
    (it.s ? "<div><h4>" + T(UI.steps) + "</h4><ol>" + li(it.s) + "</ol></div>" : "") +
    (it.m ? "<div><h4>" + T(UI.mist) + "</h4><ul>" + li(it.m) + "</ul></div>" : "") +
    (it.r ? '<p class="drill"><strong>' + T(UI.drill) + ":</strong> " + T(it.r) + "</p>" : "") +
    (suf ? vids(it, suf) : "") + "</article>";
}
function listCard(it, o) {
  return '<article class="card"' + exAttrs(it) + '><header class="ch"><h3>' + T(it.n) + "</h3>" + addBtn(it) + "</header>" + (it.d ? '<p class="d">' + T(it.d) + "</p>" : "") +
    '<ol>' + li(it.s) + "</ol>" + (it.r ? '<p class="drill">' + T(it.r) + "</p>" : "") + "</article>";
}
function sec(id, title, lead, body) {

/* ---------- timer ---------- */
const PRESETS = [
  { n: ["مبتدئ 4×2", "Beginner 4×2"], r: 4, w: 120, t: 60 }, { n: ["قياسي 6×3", "Standard 6×3"], r: 6, w: 180, t: 60 },
  { n: ["ملاكم 12×3", "Fighter 12×3"], r: 12, w: 180, t: 60 }, { n: ["لياقة 10×30/30", "Conditioning 10×30/30"], r: 10, w: 30, t: 30 }
];
const TS = { cfg: { rounds: 6, work: 180, rest: 60, prep: 10 }, phase: "idle", round: 1, left: 180000, running: false, endAt: 0, iv: null, w10: false, callOn: false, voice: true, callLv: "b", every: 8, nextCall: 0, call: null };
let ac = null, wl = null;
function initAudio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} }
function beep(f, d, when, vol) {
  if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when || 0); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(vol || 0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
}
function bell() { beep(880, 1.1, 0, 0.3); beep(1320, 0.8, 0, 0.12); beep(880, 1.1, 0.6, 0.3); }
function wake(on) { try { if (on) { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wl = l; }).catch(() => {}); } else if (wl) { wl.release(); wl = null; } } catch (e) {} }
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function drawTimer() {
  const b = document.getElementById("tBox"); if (!b) return;
  const p = TS.phase;
  b.className = "tbox" + (p === "work" ? " work" : p === "rest" ? " rest" : "");
  const names = { idle: ["جاهز", "Ready"], ready: ["استعد", "Get ready"], work: ["اضرب", "Work"], rest: ["راحة", "Rest"], done: ["انتهى التمرين", "Done"] };
  document.getElementById("tPh").textContent = T(names[p]);
  document.getElementById("tTm").textContent = fmt(p === "idle" ? TS.cfg.work * 1000 : TS.left);
  document.getElementById("tRd").textContent = (p === "idle" || p === "ready" || p === "done") ? "" : T(["الجولة ", "Round "]) + TS.round + " / " + TS.cfg.rounds;
  const tot = p === "work" ? TS.cfg.work * 1000 : p === "rest" ? TS.cfg.rest * 1000 : p === "ready" ? TS.cfg.prep * 1000 : 1;
  const prog = p === "idle" ? 1 : p === "done" ? 0 : Math.max(0, Math.min(1, TS.left / tot));
  document.getElementById("tRing").style.strokeDashoffset = String(741.4 * (1 - prog));
  b.classList.toggle("hot", p === "work" && TS.running && TS.left <= 10000 && TS.cfg.work > 20);
  const secs = TS.cfg.rounds * TS.cfg.work + (TS.cfg.rounds - 1) * TS.cfg.rest;
  document.getElementById("tTot").textContent = T(["مدة التمرين الكلية: ", "Total workout time: "]) + Math.round(secs / 6) / 10 + T([" دقيقة", " min"]);
  drawCall();
  document.getElementById("tGo").textContent = TS.running ? T(["إيقاف مؤقت", "Pause"]) : (p === "idle" || p === "done" ? T(["ابدأ", "Start"]) : T(["تابع", "Resume"]));
  const r = document.getElementById("cR"), w = document.getElementById("cW"), t = document.getElementById("cT");
  if (r && document.activeElement !== r) r.value = TS.cfg.rounds;
  if (w && document.activeElement !== w) w.value = TS.cfg.work;
  if (t && document.activeElement !== t) t.value = TS.cfg.rest;
  const cc = document.getElementById("cCall"), cv = document.getElementById("cVoice"), cl = document.getElementById("cLv"), ce = document.getElementById("cEvery");
  if (cc) cc.checked = TS.callOn;
  if (cv) cv.checked = TS.voice;
  if (cl) cl.value = TS.callLv;
  if (ce && document.activeElement !== ce) ce.value = TS.every;
}
function setPhase(ph, ms) {
  TS.phase = ph; TS.left = ms; TS.endAt = Date.now() + ms; TS.w10 = false;
  if (ph === "work") TS.nextCall = Date.now() + 1500; else TS.call = null;
}
const NUMW = [["", "واحد", "اتنين", "تلاتة", "أربعة", "خمسة", "ستة"], ["", "one", "two", "three", "four", "five", "six"]];
function speakCombo(c) {
  if (!TS.voice) return;
  try {
    if (!window.speechSynthesis) return;
    const words = c.q.map(t => { const m = /^([1-6])(b?)$/.exec(t); return m ? NUMW[L][m[1]] + (m[2] ? (L ? " body" : " جسم") : "") : T(TOK[t] || [t, t]); });
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(words.join(L ? ", " : "، "));
    u.lang = L ? "en-US" : "ar-EG"; u.rate = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function callCombo() {
  const p = TS.callLv === "all" ? COMBO : COMBO.filter(c => c.lv === TS.callLv);
  TS.call = p[Math.floor(Math.random() * p.length)];
  drawCall(); speakCombo(TS.call);
}
function drawCall() {
  const el = document.getElementById("tCall"); if (!el) return;
  const want = TS.call && TS.phase === "work" && TS.callOn ? TS.call : null;
  if (el.dataset.cur === (want ? want.q.join("-") + TS.round : "")) return;
  el.dataset.cur = want ? want.q.join("-") + TS.round : "";
  el.innerHTML = want ? want.q.map(chip).join("") : "";
  el.querySelectorAll(".chip").forEach((x, i) => x.style.setProperty("--i", i));
}
function nextPhase() {
  if (TS.phase === "ready") { setPhase("work", TS.cfg.work * 1000); bell(); }
  else if (TS.phase === "work") {
    if (TS.round >= TS.cfg.rounds) { setPhase("done", 0); TS.running = false; clearInterval(TS.iv); TS.iv = null; wake(false); bell(); }
    else { setPhase("rest", TS.cfg.rest * 1000); beep(660, 0.6, 0, 0.25); }
  } else if (TS.phase === "rest") { TS.round++; setPhase("work", TS.cfg.work * 1000); bell(); }
}
function tick() {
  if (!TS.running) return;
  const l = TS.endAt - Date.now();
  if (l <= 0) nextPhase(); else {
    TS.left = l;
    if (TS.callOn && TS.phase === "work" && Date.now() >= TS.nextCall && l > 3000) { callCombo(); TS.nextCall = Date.now() + TS.every * 1000; }
    if (TS.phase === "work" && !TS.w10 && l <= 10000 && TS.cfg.work > 20) { TS.w10 = true; beep(1000, 0.25, 0, 0.25); beep(1000, 0.25, 0.35, 0.25); }
  }

}
function toggleTimer() {

  if (TS.phase === "idle" || TS.phase === "done") { TS.round = 1; setPhase("ready", TS.cfg.prep * 1000); }
  else TS.endAt = Date.now() + TS.left;

}

  const set = new Set(LOG), today = dkey(new Date());
  let streak = 0; const d = new Date(); if (!set.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dkey(d))) { streak++; d.setDate(d.getDate() - 1); }
  let last7 = 0; for (let i = 0; i < 7; i++) { const x = new Date(); x.setDate(x.getDate() - i); if (set.has(dkey(x))) last7++; }
  let cells = ""; for (let i = 34; i >= 0; i--) { const x = new Date(); x.setDate(x.getDate() - i); const k = dkey(x); cells += '<i class="' + (set.has(k) ? "on" : "") + (k === today ? " today" : "") + '" style="--i:' + (34 - i) + '">' + x.getDate() + "</i>"; }
  box.innerHTML = '<header class="ch"><h3>' + T(["سجل التمرين", "Training log"]) + "</h3></header>" +
    '<div class="kpis"><div class="kpi"><b>' + streak + "</b><span>" + T(["أيام متتالية", "Day streak"]) + '</span></div><div class="kpi"><b>' + last7 + "</b><span>" + T(["آخر 7 أيام", "Last 7 days"]) + '</span></div><div class="kpi"><b>' + set.size + "</b><span>" + T(["إجمالي الحصص", "Total sessions"]) + "</span></div></div>" +
    '<div class="lg">' + cells + "</div>" +
    '<button class="btn ' + (set.has(today) ? "" : "p") + '" type="button" data-act="log">' + (set.has(today) ? T(["إلغاء تسجيل اليوم", "Undo today"]) : T(["سجلت تمرين اليوم", "I trained today"])) + "</button>";
}
function toggleToday() {
  const k = dkey(new Date()), i = LOG.indexOf(k);
  if (i >= 0) LOG.splice(i, 1); else { LOG.push(k); toast(T(["أحسنت! تم تسجيل حصة اليوم", "Nice work! Today's session is logged"])); }
  store("bx-log", LOG); renderLog();
}
const HZ = [[["إحماء وتعافي", "Warm-up and recovery"], 0.5, 0.6, 0.35], [["تحمل أساسي", "Base endurance"], 0.6, 0.7, 0.5], [["هوائي متوسط", "Aerobic"], 0.7, 0.8, 0.65], [["شدة عالية (جولات الشوال)", "Hard (bag rounds)"], 0.8, 0.9, 0.82], [["أقصى جهد", "Max effort"], 0.9, 1, 1]];
function renderHR() {
  const out = document.getElementById("hrOut"); if (!out) return;
  const mx = 220 - HR_AGE;
  out.innerHTML = HZ.map((z, i) => '<div class="hz"><span>' + T(z[0]) + '</span><div class="hb"><i style="background:' + (i < 2 ? "var(--blue)" : "var(--red)") + ";opacity:" + (0.45 + i * 0.14) + '" data-w="' + Math.round(z[3] * 100) + '"></i></div><span>' + Math.round(mx * z[1]) + "-" + Math.round(mx * z[2]) + "</span></div>").join("");
  requestAnimationFrame(() => requestAnimationFrame(() => out.querySelectorAll(".hb i").forEach(b => { b.style.width = b.dataset.w + "%"; })));
}

function fillStats() {
  const vals = [[...document.querySelectorAll("[data-ex]")].filter(c => c.querySelector(".vid")).length, COMBO.length, document.querySelectorAll(".vid a").length, 12];
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".stat b").forEach((b, i) => {
    const v = vals[i]; if (still) { b.textContent = v; return; }
    const t0 = performance.now();
    (function f(t) { const p = Math.min(1, (t - t0) / 1200); b.textContent = Math.round(v * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0);
  });
}

let IO = null, SPY = null;
function attachReveal() {
  const els = document.querySelectorAll(".card,.sh,.roul,.tbox");
  if (IO) IO.disconnect();
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  IO = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); IO.unobserve(en.target); } }), { rootMargin: "0px 0px -6% 0px", threshold: 0.05 });
  els.forEach((e, i) => { e.classList.add("rv"); e.style.setProperty("--d", (i % 5) * 70 + "ms"); IO.observe(e); });
}
function attachSpy() {
  if (!("IntersectionObserver" in window)) return;
  if (SPY) SPY.disconnect();
  SPY = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    document.querySelectorAll(".chips a").forEach(a => {
      if (a.getAttribute("href") === "#" + en.target.id) { a.setAttribute("aria-current", "true"); a.scrollIntoView({ block: "nearest", inline: "center" }); }
      else a.removeAttribute("aria-current");
    });
  }), { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("#app section").forEach(s => SPY.observe(s));
}
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const h = document.documentElement, max = h.scrollHeight - window.innerHeight, p = max > 0 ? window.scrollY / max : 0;
    document.querySelector("#sp i").style.transform = "scaleX(" + p + ")";
    document.getElementById("fabTop").classList.toggle("show", window.scrollY > 700);
  });
}, { passive: true });

function renderAll() {
  document.documentElement.lang = L ? "en" : "ar";
  document.documentElement.dir = L ? "ltr" : "rtl";
  applyTheme();
  renderHero(); renderNav(); renderApp(); renderChrome();
  renderCombosList(); renderRoulette(); applyChecks(); renderSession(); renderLog(); renderHR();
  if (TS.phase === "idle") TS.left = TS.cfg.work * 1000;
  document.getElementById("tCall").dataset.cur = "x";
  drawTimer(); fillStats(); applyFilter(); attachReveal(); attachSpy();
}
/* ---------- export / import (JSON) ---------- */
function exportData() {
  const data = { app: "boxing-from-zero", version: 1, exportedAt: new Date().toISOString(), data: { lang: L ? "en" : "ar", theme: THEME, age: HR_AGE, done: DONE, sess: SESS, log: LOG } };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "boxing-backup-" + dkey(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(T(["تم تصدير البيانات", "Data exported"]));
  } catch (e) { toast(T(["تعذر التصدير", "Export failed"])); }
}
function importData(file) {
  const bad = () => toast(T(["ملف غير صالح", "Invalid file"]));
  if (!file) return;
  const r = new FileReader();
  r.onerror = bad;
  r.onload = () => {
    let j; try { j = JSON.parse(r.result); } catch (e) { return bad(); }
    const d = j && (j.app === "boxing-from-zero" ? j.data : null);
    if (!d || typeof d !== "object") return bad();
    const done = {};
    if (d.done && typeof d.done === "object" && !Array.isArray(d.done)) Object.keys(d.done).forEach(k => { if (/^c\d+_\d+$/.test(k) && d.done[k]) done[k] = true; });
    DONE = done; saveDone();
    SESS = Array.isArray(d.sess) ? [...new Set(d.sess.filter(k => typeof k === "string" && KEYS[k]))] : []; store("bx-sess", SESS);
    LOG = Array.isArray(d.log) ? [...new Set(d.log.filter(k => typeof k === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k)))] : []; store("bx-log", LOG);
    if (["auto", "light", "dark"].includes(d.theme)) { THEME = d.theme; store("bx-theme", THEME); }
    const age = parseInt(d.age, 10); if (age >= 10 && age <= 90) { HR_AGE = age; store("bx-age", String(HR_AGE)); }
    if (d.lang === "en" || d.lang === "ar") { L = d.lang === "en" ? 1 : 0; store("bx-lang", d.lang); }
    renderAll();
    toast(T(["تم استيراد البيانات", "Data imported"]));
  };
  r.readAsText(file);
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "export") exportData();
  else if (el.dataset.act === "import") { const f = document.getElementById("impFile"); if (f) f.click(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "impFile") { importData(e.target.files[0]); e.target.value = ""; }
});

renderAll();
</script>

</body></html>
